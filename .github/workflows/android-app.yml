name: Android-приложение AlemWay

# Собирает APK из папки mobile/. Приложение открывает живой сайт alemway.kz,
# поэтому пересобирать его после изменений сайта не нужно — только когда меняется сама оболочка.
on:
  push:
    # app-links — проверочная сборка (без выкладки в Releases).
    branches: [app, app-links]
    paths:
      - "mobile/**"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx cap sync android
      - name: Постоянный ключ подписи
        env:
          AW_KEYSTORE_B64: ${{ secrets.AW_KEYSTORE_B64 }}
        run: |
          if [ -n "$AW_KEYSTORE_B64" ]; then
            echo "$AW_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/aw.jks"
            echo "AW_KEYSTORE=$RUNNER_TEMP/aw.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Нет секрета AW_KEYSTORE_B64: APK подписан временным ключом и не встанет поверх прошлой версии"
          fi
      - name: Сборка APK
        working-directory: mobile/android
        env:
          AW_KEY_PASS: ${{ secrets.AW_KEY_PASS }}
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk AlemWay.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AlemWay-apk
          path: mobile/AlemWay.apk
          if-no-files-found: error
      - name: Выложить APK в Releases
        if: github.ref == 'refs/heads/app'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Без постоянного ключа клиенты не смогут обновиться поверх: такой APK не выкладываем.
          [ -n "$AW_KEYSTORE" ] || { echo "::error::Нет постоянного ключа подписи"; exit 1; }
          # Заменяем файл в том же релизе: удаление и пересоздание могло оставить релиз черновиком (ссылка 404).
          if gh release view app-latest >/dev/null 2>&1; then
            gh release upload app-latest AlemWay.apk --clobber
            gh release edit app-latest --draft=false --prerelease
          else
            gh release create app-latest AlemWay.apk --target "$GITHUB_SHA" --prerelease \
              --title "Приложение AlemWay (Android)" \
              --notes "Скачайте AlemWay.apk на телефон и установите. Приложение открывает живой сайт alemway.kz."
          fi
