name: Android-приложение AlemWay

# Собирает APK из папки mobile/. Приложение открывает живой сайт alemway.kz,
# поэтому пересобирать его после изменений сайта не нужно — только когда меняется сама оболочка.
on:
  push:
    branches: [app]
    paths:
      - "mobile/**"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx cap sync android
      - name: Сборка APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk AlemWay.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AlemWay-apk
          path: mobile/AlemWay.apk
          if-no-files-found: error
